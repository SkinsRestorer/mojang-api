name: Cargo deny

on:
  # Other branches are checked through their pull requests. Renovate automerges non-major updates
  # by pushing its branch without opening a pull request, so those pushes need their own run.
  push:
    branches: [main, 'renovate/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  # Include the event so that a push to main does not cancel the weekly scheduled run.
  group: cargo-deny-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check dependencies
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0

      - name: Run cargo-deny
        run: cargo deny --locked check
