name: Publish GHCR Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Build and test
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.arch }} image
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare image tag
        env:
          ARCH: ${{ matrix.arch }}
        run: echo "IMAGE_TAG=${REGISTRY}/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::12}-${ARCH}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  publish:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-26.04

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          sha_tag="${image}:sha-${GITHUB_SHA::12}"

          docker buildx imagetools create \
            --tag "$sha_tag" \
            --tag "${image}:main" \
            --tag "${image}:latest" \
            "${sha_tag}-amd64" \
            "${sha_tag}-arm64"

          docker buildx imagetools inspect "$sha_tag"

      - name: Deploy to Dokploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          : "${DOKPLOY_WEBHOOK_URL:?Set the DOKPLOY_WEBHOOK_URL repository secret}"

          status=$(curl --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 \
            --write-out '%{http_code}' \
            --request POST "$DOKPLOY_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --data '{}')

          case "$status" in
            2??) echo "Dokploy deployment requested." ;;
            *) echo "::error::Dokploy webhook returned HTTP $status"; exit 1 ;;
          esac
