name: Publish GHCR Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Railpack
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --silent --show-error --location https://railpack.com/install.sh | sh -s -- --bin-dir "$HOME/.local/bin"
          "$HOME/.local/bin/railpack" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Start BuildKit
        run: |
          docker run --rm --privileged -d --name railpack-buildkit moby/buildkit:latest
          echo "BUILDKIT_HOST=docker-container://railpack-buildkit" >> "$GITHUB_ENV"

      - name: Build image with Railpack
        id: image
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::12}"

          railpack build --name "${image}:sha-${short_sha}" .
          docker tag "${image}:sha-${short_sha}" "${image}:main"
          docker tag "${image}:sha-${short_sha}" "${image}:latest"

          {
            echo "image=${image}"
            echo "short_sha=${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Push image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHORT_SHA: ${{ steps.image.outputs.short_sha }}
        run: |
          docker push "${IMAGE}:sha-${SHORT_SHA}"
          docker push "${IMAGE}:main"
          docker push "${IMAGE}:latest"

      - name: Stop BuildKit
        if: always()
        run: docker rm -f railpack-buildkit || true
