name: Publish GHCR Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Railpack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --silent --show-error --location https://railpack.com/install.sh | sh -s -- --bin-dir "$HOME/.local/bin"
          "$HOME/.local/bin/railpack" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Start BuildKit
        run: |
          docker run --rm --privileged -d --name railpack-buildkit moby/buildkit:latest
          echo "BUILDKIT_HOST=docker-container://railpack-buildkit" >> "$GITHUB_ENV"

      - name: Build and push image with Railpack
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tag="${REGISTRY}/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::12}-${ARCH}"

          railpack build --name "$tag" .
          docker push "$tag"

      - name: Stop BuildKit
        if: always()
        run: docker rm -f railpack-buildkit || true

  publish:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-26.04

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          sha_tag="${image}:sha-${GITHUB_SHA::12}"

          docker buildx imagetools create \
            --tag "$sha_tag" \
            --tag "${image}:main" \
            --tag "${image}:latest" \
            "${sha_tag}-amd64" \
            "${sha_tag}-arm64"

          docker buildx imagetools inspect "$sha_tag"

      - name: Deploy to Dokploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          : "${DOKPLOY_WEBHOOK_URL:?Set the DOKPLOY_WEBHOOK_URL repository secret}"

          status=$(curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 \
            --write-out '%{http_code}' \
            --request POST "$DOKPLOY_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --data '{}')

          case "$status" in
            2??) echo "Dokploy deployment requested." ;;
            *) echo "::error::Dokploy webhook returned HTTP $status"; exit 1 ;;
          esac
