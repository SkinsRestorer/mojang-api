name: Publish GHCR Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Build and test
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.arch }} image
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Railpack
        env:
          ARCH: ${{ matrix.arch }}
          # Renovate updates this version in a pull request that does not run this workflow.
          # Copy the new checksums from the release's checksums.txt before merging it.
          RAILPACK_VERSION: v0.43.0
        run: |
          case "$ARCH" in
            amd64)
              target=x86_64-unknown-linux-musl
              sha256=248a8f60f36854aabed6124113631078a802de3461660855fc4de9c26065c1fb
              ;;
            arm64)
              target=arm64-unknown-linux-musl
              sha256=732ece14eb4f4676a43ebba19431f954edf7b130acb76159ef0f2ff86ac42ac9
              ;;
            *)
              echo "::error::Unsupported architecture $ARCH"
              exit 1
              ;;
          esac

          archive="$RUNNER_TEMP/railpack.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/railwayapp/railpack/releases/download/${RAILPACK_VERSION}/railpack-${RAILPACK_VERSION}-${target}.tar.gz"
          echo "${sha256}  ${archive}" | sha256sum --check --strict

          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" railpack
          "$HOME/.local/bin/railpack" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Start BuildKit
        run: |
          docker run --rm --privileged -d --name railpack-buildkit moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          echo "BUILDKIT_HOST=docker-container://railpack-buildkit" >> "$GITHUB_ENV"

      - name: Build and push image with Railpack
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tag="${REGISTRY}/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::12}-${ARCH}"

          railpack build --name "$tag" .
          docker push "$tag"

      - name: Stop BuildKit
        if: always()
        run: docker rm -f railpack-buildkit || true

  publish:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-26.04

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          sha_tag="${image}:sha-${GITHUB_SHA::12}"

          docker buildx imagetools create \
            --tag "$sha_tag" \
            --tag "${image}:main" \
            --tag "${image}:latest" \
            "${sha_tag}-amd64" \
            "${sha_tag}-arm64"

          docker buildx imagetools inspect "$sha_tag"

      - name: Deploy to Dokploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          : "${DOKPLOY_WEBHOOK_URL:?Set the DOKPLOY_WEBHOOK_URL repository secret}"

          status=$(curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 \
            --write-out '%{http_code}' \
            --request POST "$DOKPLOY_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --data '{}')

          case "$status" in
            2??) echo "Dokploy deployment requested." ;;
            *) echo "::error::Dokploy webhook returned HTTP $status"; exit 1 ;;
          esac
