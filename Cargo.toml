[package]
name = "mojang-api"
version = "2.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
description = "A caching and batching proxy for Mojang profile APIs"

[dependencies]
async-trait = "0.1.91"
axum = "0.8.9"
bytes = "1.12.1"
dotenvy = "0.15.7"
jiff = { version = "0.2.34", default-features = false, features = ["std"] }
moka = { version = "0.12.15", features = ["future"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = [
  "brotli",
  "deflate",
  "gzip",
  "json",
  "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", default-features = false, features = [
  "axum",
  "vendored",
] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
