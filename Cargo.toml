[package]
name = "mojang-api"
version = "2.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
description = "A caching and batching proxy for Mojang profile APIs"

[dependencies]
async-trait = "0.1.91"
axum = { version = "0.8.9", default-features = false, features = [
  "json",
  "tokio",
  "tracing",
] }
bytes = "1.12.1"
dotenvy = "0.15.7"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = [
  "http1",
  "server",
  "server-graceful",
  "tokio",
] }
ipnet = "2.12.0"
jiff = { version = "1.0.0", default-features = false, features = ["std"] }
moka = { version = "0.12.15", features = ["future"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = [
  "brotli",
  "deflate",
  "gzip",
  "json",
  "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "10.0.0", default-features = false, features = [
  "vendored",
] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde"] }

[dev-dependencies]
# The tests run real servers with `axum::serve`.
axum = { version = "0.8.9", default-features = false, features = ["http1"] }
tokio = { version = "1.53.1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
unit_bindings = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Noisy nursery lints
missing_const_for_fn = "allow"
option_if_let_else = "allow"
future_not_send = "allow"
redundant_pub_crate = "allow"
suboptimal_flops = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"
# Safety and correctness
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
string_slice = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
exit = "warn"
rc_buffer = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
try_err = "warn"
rest_pat_in_fully_bound_structs = "warn"
iter_over_hash_type = "warn"
let_underscore_must_use = "warn"
# Better test failures
assertions_on_result_states = "warn"
missing_assert_message = "warn"
# Additional safety and correctness checks
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
panic_in_result_fn = "warn"
unreachable = "warn"
clone_on_ref_ptr = "warn"
wildcard_enum_match_arm = "warn"
empty_structs_with_brackets = "warn"
empty_enum_variants_with_brackets = "warn"
